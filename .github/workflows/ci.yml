name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, openssl, tokenizer, xml, ctype, json, bcmath
          coverage: none
      - run: composer validate --no-check-publish
      - name: Install Composer dependencies
        run: |
          set -o pipefail
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee composer-install.log
      - name: Upload Composer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-install-log
          path: backend/composer-install.log
      - run: find app config database routes -name '*.php' -print0 | xargs -0 -n1 php -l
