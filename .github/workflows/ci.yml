name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: autoevolve_ci
          MYSQL_USER: autoevolve_ci
          MYSQL_PASSWORD: ci_password_only
          MYSQL_ROOT_PASSWORD: ci_root_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, openssl, tokenizer, xml, ctype, json, bcmath
          coverage: none
      - run: composer validate --no-check-publish
      - name: Install Composer dependencies
        run: |
          set -o pipefail
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee composer-install.log
      - name: Upload Composer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-install-log
          path: backend/composer-install.log
      - name: PHP syntax check
        run: find app config database routes public -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Laravel MySQL boot, migrations, routes and views
        env:
          APP_ENV: testing
          APP_KEY: base64:ZHVtbXktMzItYnl0ZS1hcHAta2V5LWZvci1jaQ==
          APP_URL: http://localhost
          FRONTEND_URL: http://localhost
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: autoevolve_ci
          DB_USERNAME: autoevolve_ci
          DB_PASSWORD: ci_password_only
          SESSION_DRIVER: database
          CACHE_STORE: database
          QUEUE_CONNECTION: database
          MAIL_MAILER: array
        run: |
          php artisan migrate:fresh --force
          php artisan config:cache
          php artisan route:list
          php artisan view:cache
          php artisan about
